### model
model_name_or_path: models/Qwen3-VL-2B-Instruct

image_max_pixels: 2073600
image_min_pixels: 1024

video_max_pixels: 589824
video_min_pixels: 1024

trust_remote_code: true
flash_attn: auto

### method
stage: sft
do_train: true

finetuning_type: lora

lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

lora_target: all
additional_target: ["visual.merger"]

freeze_vision_tower: true
freeze_multi_modal_projector: false

# qwen3_vl_nothink 会把数据集中显式的 <think>...</think> 当作普通 assistant
# 文本参与 SFT，不会自动生成或剥离 Qwen3-VL Thinking 模式的思考内容。
enable_thinking: false

### dataset
dataset: cotton_cot_train
eval_dataset: cotton_cot_valid
dataset_dir: data
template: qwen3_vl_nothink

# 使用 Qwen3-VL-2B-Instruct 官方 tokenizer 全量审计：当前 image_max_pixels
# 最多对应 2025 个视觉 token，训练/验证完整序列最大约 4503/4760 token；
# 10240 仍有约 5480 token 余量，可完整保留现有 CoT 监督数据。
cutoff_len: 10240

max_samples: 100000

preprocessing_num_workers: 4
dataloader_num_workers: 2

packing: false

### output
output_dir: outputs/cotton/qwen2b/lora_cot

logging_steps: 1

save_steps: 1000

plot_loss: true

overwrite_output_dir: true
save_only_model: false

report_to: none

include_num_input_tokens_seen: true

### train
# 长 CoT 序列会提高峰值显存；2 x 8 保持原配置 4 x 4 的等效 batch size。
per_device_train_batch_size: 2

gradient_accumulation_steps: 8

learning_rate: 5e-5

num_train_epochs: 20

lr_scheduler_type: cosine

warmup_ratio: 0.03

optim: adamw_torch

max_grad_norm: 1.0

bf16: true

ddp_timeout: 180000000

resume_from_checkpoint: null

### eval
# val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 1000
