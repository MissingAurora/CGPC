### model
model_name_or_path: models/Qwen3-VL-2B-Instruct

image_max_pixels: 2073600
image_min_pixels: 1024

video_max_pixels: 589824
video_min_pixels: 1024

trust_remote_code: true
flash_attn: auto

### method
stage: sft
do_train: true

finetuning_type: lora

lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

lora_target: all
additional_target: ["visual.merger"]

freeze_vision_tower: true
freeze_multi_modal_projector: false

enable_thinking: false

### dataset
dataset: new_train
eval_dataset: new_valid
dataset_dir: data
template: qwen3_vl_nothink

cutoff_len: 6144

max_samples: 100000

preprocessing_num_workers: 4
dataloader_num_workers: 2

packing: false

### output
output_dir: outputs/cotton/qwen2b/lora

logging_steps: 1

save_steps: 1000

plot_loss: true

overwrite_output_dir: true
save_only_model: false

report_to: none

include_num_input_tokens_seen: true

### train
per_device_train_batch_size: 4

gradient_accumulation_steps: 4

learning_rate: 5e-5

num_train_epochs: 20

lr_scheduler_type: cosine

warmup_ratio: 0.03

optim: adamw_torch

max_grad_norm: 1.0

bf16: true

ddp_timeout: 180000000

resume_from_checkpoint: null

### eval
# val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 1000
